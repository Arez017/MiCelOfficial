services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: micel-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: micel
      DB_USERNAME: micel
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - micel

  nginx:
    image: nginx:alpine
    container_name: micel-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - micel

  db:
    image: postgres:16-alpine
    container_name: micel-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: micel
      POSTGRES_USER: micel
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micel -d micel"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - micel

volumes:
  pgdata:

networks:
  micel: